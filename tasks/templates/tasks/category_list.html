<!DOCTYPE html>
<html>
<head>
    <title>Category List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>Categories</h2>

<a href="{% url 'category_add' %}" class="btn btn-success mb-3">
Add Category
</a>

<table class="table table-bordered">

<tr>

<th>ID</th>

<th>Name</th>

<th>Action</th>

</tr>

{% for category in categories %}

<tr>

<td>{{category.id}}</td>

<td>{{category.name}}</td>

<td>

<a href="{% url 'category_edit' category.id %}" class="btn btn-primary btn-sm">
Edit
</a>

<a href="{% url 'category_delete' category.id %}" class="btn btn-danger btn-sm">
Delete
</a>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
