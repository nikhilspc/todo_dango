<!DOCTYPE html>
<html>
<head>
    <title>Product Form</title>
    <style>
        body{
            font-family: Arial;
            background:#f5f5f5;
        }

        .container{
            width:500px;
            margin:40px auto;
            background:white;
            padding:20px;
            border-radius:8px;
            box-shadow:0 0 10px gray;
        }

        input,select,textarea{
            width:100%;
            padding:8px;
            margin-bottom:12px;
        }

        button{
            background:green;
            color:white;
            border:none;
            padding:10px 18px;
            cursor:pointer;
        }

        a{
            text-decoration:none;
        }
    </style>

</head>
<body>

<div class="container">
<h2>Product Form</h2>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Save Product</button>

</form>
<br>

<a href="{% url 'product_list' %}">Back</a>

</div>
</body>
</html>
